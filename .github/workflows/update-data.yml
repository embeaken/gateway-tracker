name: Update data

on:
  workflow_dispatch:
  schedule:
    # 10AM, 1PM, 5PM, 7PM, and 9PM Eastern on weekdays (UTC schedule)
    - cron: "0 14,17,21,23 * * 1-5"
    - cron: "0 1 * * 2-6"

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5

      - name: Update activity data
        run: uv run scripts/update_data.py --summary-file "$RUNNER_TEMP/update-summary.md"
        env:
          HUDSON_TUBE_ANTHROPIC_API_KEY: ${{ secrets.HUDSON_TUBE_ANTHROPIC_API_KEY }}

      # On failure the script leaves fundingData.json alone and says so in the
      # summary; the activity data PR should still go out.
      - name: Update federal funding data
        continue-on-error: true
        run: uv run scripts/update_funding.py --summary-file "$RUNNER_TEMP/update-summary.md"

      - name: Branch name
        id: branch-name
        run: echo "branch-name=$(date +'%Y-%m-%d-%s')" >> $GITHUB_OUTPUT

      - name: Create or update pull request
        id: create-pr
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          token: ${{ secrets.PAT_TOKEN }}
          branch: ci/update-data-${{ steps.branch-name.outputs.branch-name }}
          delete-branch: true
          commit-message: "update data"
          title: "[${{ steps.branch-name.outputs.branch-name }}] update data"
          body-path: ${{ runner.temp }}/update-summary.md

      - name: Close older PRs
        if: steps.create-pr.outputs.pull-request-number
        run: |
          gh pr list --state open --limit 100 --json number,headRefName \
            --jq '.[] | select(.headRefName | startswith("ci/update-data-")) | .number' |
          while read -r number; do
            if [ "$number" != "${{ steps.create-pr.outputs.pull-request-number }}" ]; then
              gh pr close "$number" --delete-branch
            fi
          done
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
