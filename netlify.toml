[build]
  command = "pnpm run build"
  publish = "dist/"

[images]
  remote_images = ["https://www.gatewayprogram.org/.*"]

# Single-page app: any other path serves the app. Static files and functions
# (including /api/*) take precedence over this rule.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# The site is never framed by others; the browser shouldn't guess content types
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "frame-ancestors 'none'"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
